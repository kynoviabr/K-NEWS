name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  db-integration:
    # Supabase LOCAL efemero no runner; nunca usa o projeto remoto compartilhado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: npm ci
      - run: supabase start
      - name: Exportar chaves do Supabase local
        run: supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | tr -d '"' >> "$GITHUB_ENV"
      - run: npm run test:integration
      - if: always()
        run: supabase stop --no-backup

  e2e:
    # Navegador real contra o build de producao e o Supabase LOCAL do runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: npm ci
      - run: supabase start
      - name: Ambiente local do app (chaves de demonstracao do Supabase local)
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | tr -d '"' > supabase.env
          cat supabase.env >> "$GITHUB_ENV"
          set -a; . ./supabase.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "CRON_SECRET=e2e-ci-secret"
            echo "KNEWS_VISITOR_SALT=e2e-ci-salt"
            echo "KNEWS_DEV_PORTAL_HOST=guaruja.localhost"
          } > .env.local
          echo "CRON_SECRET=e2e-ci-secret" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
